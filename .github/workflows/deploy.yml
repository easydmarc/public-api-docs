name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the published spec
        # specs/easydmarc-openapi.json in git is only a local-dev snapshot; the site is
        # always built from the URL in the EASYDMARC_PUBLIC_API_SPEC_URL repository variable
        run: node scripts/download-spec.mjs
        env:
          EASYDMARC_PUBLIC_API_SPEC_URL: ${{ vars.EASYDMARC_PUBLIC_API_SPEC_URL }}

      - name: Regenerate API docs from the published spec
        # clean first: the OpenAPI plugin never overwrites an existing sidebar, so new tag groups
        # (and removed endpoints) would otherwise stay invisible even though the spec changed
        run: npx docusaurus clean-api-docs all && npx docusaurus gen-api-docs all

      - name: Build
        run: npx docusaurus build
        #env:
        #  BASE_URL: /${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
